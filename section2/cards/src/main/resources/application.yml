server:
  port: 9000
spring:
  application:
    name: "cards"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: never

# Learning-only: actuator shutdown endpoint
# Do NOT enable in production

management:
  endpoints:
    web:
      exposure:
        include: busrefresh, info, shutdown
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true