server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: accounts
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s
# Learning-only: actuator shutdown endpoint
# Do NOT enable in production
management:
  endpoints:
    web:
      exposure:
        include: busrefresh, info, health
        exclude: shutdown
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: false
logging:
  level:
    com.eazybytes.accounts: DEBUG